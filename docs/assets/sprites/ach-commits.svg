  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
    <rect width="32" height="32" fill="none"/>
    <!-- Main branch line -->
    <rect x="6" y="15" width="20" height="2" fill="#f7cf67"/>
    <!-- Feature branch -->
    <rect x="10" y="8" width="2" height="7" fill="#f7cf67"/>
    <rect x="10" y="7" width="10" height="2" fill="#f7cf67"/>
    <rect x="19" y="8" width="2" height="9" fill="#f7cf67"/>
    <!-- Commit dots: main -->
    <rect x="4" y="13" width="6" height="6" fill="#d9a52e"/>
    <rect x="5" y="14" width="4" height="4" fill="#ffe7a1"/>
    <rect x="13" y="13" width="6" height="6" fill="#d9a52e"/>
    <rect x="14" y="14" width="4" height="4" fill="#ffe7a1"/>
    <rect x="22" y="13" width="6" height="6" fill="#d9a52e"/>
    <rect x="23" y="14" width="4" height="4" fill="#ffe7a1"/>
    <!-- Commit dot: branch -->
    <rect x="8" y="5" width="6" height="6" fill="#74ff98"/>
    <rect x="9" y="6" width="4" height="4" fill="#d0ffde"/>
    <!-- Merge arrow -->
    <rect x="18" y="16" width="2" height="3" fill="#74ff98"/>
    <!-- Sparks -->
    <rect x="28" y="4" width="2" height="2" fill="#9de9ff"/>
    <rect x="2" y="26" width="2" height="2" fill="#9de9ff"/>
    <rect x="26" y="26" width="2" height="2" fill="#f7cf67"/>
  </svg>
