  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
    <rect width="32" height="32" fill="none"/>
    <!-- Rocket body -->
    <rect x="12" y="4" width="8" height="3" fill="#d9f1ff"/>
    <rect x="11" y="7" width="10" height="14" fill="#f0f8ff"/>
    <rect x="13" y="9" width="6" height="5" fill="#7dcfff"/>
    <rect x="14" y="10" width="2" height="2" fill="#f0f8ff"/>
    <!-- Fins -->
    <rect x="7" y="16" width="4" height="7" fill="#ffa64d"/>
    <rect x="21" y="16" width="4" height="7" fill="#ffa64d"/>
    <rect x="5" y="20" width="4" height="3" fill="#d9700a"/>
    <rect x="23" y="20" width="4" height="3" fill="#d9700a"/>
    <!-- Exhaust flame -->
    <rect x="13" y="21" width="6" height="4" fill="#ffa64d"/>
    <rect x="14" y="25" width="4" height="3" fill="#ffe066"/>
    <rect x="15" y="28" width="2" height="2" fill="#f7cf67"/>
    <!-- Sparks -->
    <rect x="3" y="6" width="2" height="2" fill="#ffe066"/>
    <rect x="27" y="8" width="2" height="2" fill="#ffe066"/>
    <rect x="2" y="26" width="2" height="2" fill="#ffa64d"/>
    <rect x="28" y="27" width="2" height="2" fill="#ffa64d"/>
  </svg>
