  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
    <rect width="32" height="32" fill="none"/>
    <!-- Open book base -->
    <rect x="4" y="18" width="10" height="10" fill="#4a1f7a"/>
    <rect x="18" y="18" width="10" height="10" fill="#4a1f7a"/>
    <rect x="5" y="19" width="8" height="8" fill="#c597ff"/>
    <rect x="19" y="19" width="8" height="8" fill="#c597ff"/>
    <rect x="14" y="18" width="4" height="10" fill="#7a3fb5"/>
    <rect x="15" y="20" width="2" height="2" fill="#f0f8ff"/>
    <!-- Text lines on pages -->
    <rect x="7" y="21" width="5" height="1" fill="#4a1f7a"/>
    <rect x="7" y="23" width="5" height="1" fill="#4a1f7a"/>
    <rect x="20" y="21" width="5" height="1" fill="#4a1f7a"/>
    <rect x="20" y="23" width="4" height="1" fill="#4a1f7a"/>
    <!-- Magic runes rising -->
    <rect x="9" y="10" width="2" height="2" fill="#c597ff"/>
    <rect x="21" y="8" width="2" height="2" fill="#c597ff"/>
    <rect x="15" y="4" width="2" height="2" fill="#f0f8ff"/>
    <rect x="11" y="5" width="2" height="2" fill="#7dcfff"/>
    <rect x="19" y="3" width="2" height="2" fill="#7dcfff"/>
    <!-- Sparkles -->
    <rect x="5" y="12" width="2" height="2" fill="#f0f8ff"/>
    <rect x="25" y="13" width="2" height="2" fill="#f0f8ff"/>
    <rect x="28" y="5" width="2" height="2" fill="#c597ff"/>
  </svg>
