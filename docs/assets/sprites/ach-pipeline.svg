  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
    <rect width="32" height="32" fill="none"/>
    <!-- Horizontal pipe -->
    <rect x="2" y="13" width="28" height="6" fill="#1f8a4a"/>
    <rect x="2" y="14" width="28" height="2" fill="#74ff98"/>
    <!-- Pipe flanges -->
    <rect x="4" y="11" width="4" height="10" fill="#0f4a2a"/>
    <rect x="5" y="12" width="2" height="2" fill="#74ff98"/>
    <rect x="24" y="11" width="4" height="10" fill="#0f4a2a"/>
    <rect x="25" y="12" width="2" height="2" fill="#74ff98"/>
    <!-- Vertical pipe -->
    <rect x="13" y="2" width="6" height="28" fill="#1f8a4a"/>
    <rect x="14" y="2" width="2" height="28" fill="#74ff98"/>
    <!-- Junction -->
    <rect x="11" y="11" width="10" height="10" fill="#0f4a2a"/>
    <rect x="13" y="13" width="6" height="6" fill="#74ff98"/>
    <rect x="15" y="15" width="2" height="2" fill="#f0f8ff"/>
    <!-- Data sparks -->
    <rect x="27" y="4" width="2" height="2" fill="#9de9ff"/>
    <rect x="3" y="24" width="2" height="2" fill="#9de9ff"/>
    <rect x="28" y="26" width="2" height="2" fill="#74ff98"/>
  </svg>
