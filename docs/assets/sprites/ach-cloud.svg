  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
    <rect width="32" height="32" fill="none"/>
    <!-- Cloud body -->
    <rect x="6" y="12" width="20" height="10" fill="#d9f1ff"/>
    <rect x="9" y="8" width="6" height="4" fill="#d9f1ff"/>
    <rect x="16" y="9" width="8" height="3" fill="#d9f1ff"/>
    <rect x="4" y="15" width="2" height="5" fill="#d9f1ff"/>
    <rect x="26" y="14" width="2" height="6" fill="#d9f1ff"/>
    <!-- Cloud shading -->
    <rect x="6" y="20" width="20" height="2" fill="#7dcfff"/>
    <rect x="10" y="9" width="3" height="2" fill="#f0f8ff"/>
    <!-- Up arrow (deploy) -->
    <rect x="14" y="14" width="4" height="8" fill="#1a6aaa"/>
    <rect x="12" y="12" width="2" height="2" fill="#1a6aaa"/>
    <rect x="18" y="12" width="2" height="2" fill="#1a6aaa"/>
    <rect x="13" y="10" width="2" height="2" fill="#1a6aaa"/>
    <rect x="17" y="10" width="2" height="2" fill="#1a6aaa"/>
    <rect x="14" y="8" width="4" height="2" fill="#1a6aaa"/>
    <rect x="15" y="15" width="2" height="6" fill="#7dcfff"/>
    <!-- Sparks -->
    <rect x="2" y="6" width="2" height="2" fill="#9de9ff"/>
    <rect x="28" y="8" width="2" height="2" fill="#9de9ff"/>
    <rect x="3" y="26" width="2" height="2" fill="#7dcfff"/>
    <rect x="27" y="25" width="2" height="2" fill="#7dcfff"/>
  </svg>
